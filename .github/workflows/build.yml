name: Build TriageHound Standalone (Windows, Mac, Linux)

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.0.0, etc.
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to create releases

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other OS builds if one fails
      matrix:
        include:
          - os: windows-latest
            artifact_name: TriageHound-Windows-v1.0.exe
            pyinstaller_args: --onefile --windowed --name TriageHound-Windows-v1.0
          - os: macos-latest
            artifact_name: TriageHound-Mac-v2.0
            pyinstaller_args: --onefile --windowed --name TriageHound-Mac-v2.0
          - os: ubuntu-latest
            artifact_name: TriageHound-Linux-v3.0
            pyinstaller_args: --onefile --name TriageHound-Linux-v3.0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── System dependencies per OS ──────────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev
          sudo apt-get install -y libpango1.0-dev libpangocairo-1.0-0 libgdk-pixbuf2.0-dev libffi-dev libcairo2-dev
          sudo apt-get install -y pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo libffi gdk-pixbuf pkg-config

      # ── Install GTK for WeasyPrint (Windows) ────────────────────────
      - name: Install GTK (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install msys2 -y --no-progress
          # Add MSYS2 ucrt64 bin to PATH for WeasyPrint DLLs
          echo "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH

      # ── Python dependencies ─────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller
          pip install -r requirements.txt

      # ── Build ───────────────────────────────────────────────────────
      - name: Build standalone executable
        run: |
          pyinstaller ${{ matrix.pyinstaller_args }} gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TriageHound ${{ github.ref_name }}"
          body: |
            ## TriageHound Cross-Platform DFIR Toolkit

            **Downloads:**
            - **Windows (v1.0):** `TriageHound-Windows-v1.0.exe`
            - **macOS (v2.0):** `TriageHound-Mac-v2.0` (grant Full Disk Access to Terminal)
            - **Linux (v3.0):** `TriageHound-Linux-v3.0` (run with `sudo`)

            ### For Students / Researchers
            Clone the repository and run from source:
            ```bash
            git clone https://github.com/parthkamble4536-ship/TriageHound.git
            cd TriageHound
            pip install -r requirements.txt
            python gui.py
            ```

            ### For Law Enforcement / Incident Responders
            Download the standalone USB version for your target OS above.
            No Python installation required.

            ---
            See [README.md](README.md) for full documentation.
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false
